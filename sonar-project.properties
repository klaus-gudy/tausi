# SonarQube analysis. Run `npm run test:coverage` first for the coverage
# report, then point the scanner at a server with the token in the
# environment, never in this file: SONAR_HOST_URL=... SONAR_TOKEN=... sonar-scanner
sonar.projectKey=tausi
sonar.projectName=tausi
sonar.sourceEncoding=UTF-8

sonar.sources=app,components,hooks,lib,prisma,scripts,docker,proxy.ts,instrumentation.ts,next.config.ts,prisma.config.ts,Dockerfile
sonar.tests=scripts
sonar.test.inclusions=**/*.test.mjs
sonar.exclusions=**/node_modules/**,.next/**,lib/generated/**,prisma/migrations/**,**/*.test.mjs
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# shadcn/ui primitives are copied in from the registry; keep them out of the
# duplication check, where their shared shape reads as copy-paste.
sonar.cpd.exclusions=components/ui/**,lib/tanzania-places.ts
